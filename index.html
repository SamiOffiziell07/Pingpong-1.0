    <!-- Plain script on purpose: it must keep working even if the game modules fail to load -->
    <script>
      (function () {
        var splash = document.getElementById('splash');
        var errBox = document.getElementById('splash-error');
        var errTitle = document.getElementById('splash-error-title');
        var errText = document.getElementById('splash-error-text');
        var retry = document.getElementById('splash-retry');
        var lang = String(navigator.language || 'en').toLowerCase().slice(0, 2);
        var T = {
          en: {
            fail: 'Couldn’t load the game',
            failText: 'Please check your internet connection and try again.',
            slow: 'Taking longer than usual',
            slowText: 'Your connection seems slow. The game keeps loading – or you can reload.',
            retry: 'Reload'
          },
          de: {
            fail: 'Spiel konnte nicht geladen werden',
            failText: 'Bitte prüfe deine Internetverbindung und versuche es erneut.',
            slow: 'Das Laden dauert länger als üblich',
            slowText: 'Deine Verbindung scheint langsam zu sein. Das Spiel lädt weiter – oder du lädst neu.',
            retry: 'Neu laden'
          }
        };
        var t = T[lang] || T.en;
        var isReady = false;
        var slowTimer = null;

        function showMessage(kind) {
          if (isReady || !splash) return;
          splash.classList.toggle('is-error', kind === 'fail');
          splash.classList.add('has-message');
          errTitle.textContent = kind === 'fail' ? t.fail : t.slow;
          errText.textContent = kind === 'fail' ? t.failText : t.slowText;
          retry.textContent = t.retry;
          errBox.hidden = false;
        }

        function ready() {
          if (isReady) return;
          isReady = true;
          clearTimeout(slowTimer);
          document.body.classList.add('app-ready');
          if (!splash) return;
          splash.classList.add('is-hidden');
          var remove = function () { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); splash = null; };
          splash.addEventListener('transitionend', remove, { once: true });
          setTimeout(remove, 800);
        }

        function fail(reason) {
          if (window.console) console.error('[SAMIX] load failed:', reason);
          clearTimeout(slowTimer);
          showMessage('fail');
        }

        retry.addEventListener('click', function () { window.location.reload(); });

        // Only complain about genuinely slow loads, never delay a fast one.
        slowTimer = setTimeout(function () { showMessage('slow'); }, 12000);

        // Only a failure of the game's own files (or a crash inside them while
        // booting) may stop the start. Unrelated errors never show the error screen.
        window.addEventListener('error', function (e) {
          var el = e && e.target;
          if (el && el.tagName === 'SCRIPT') {
            if (/(game|phaser\.min)\.js/.test(el.src || '')) fail(el.src);
            return;
          }
          if (e && e.filename && /game\.js/.test(e.filename)) fail(e.message);
        }, true);

        window.SAMIX = { ready: ready, fail: fail };
      })();
    </script>

          <p class="sheet-score sheet-score--small" id="pause-score" aria-label="Current score"></p>
          <button class="btn btn-primary" id="resume-btn" type="button">Resume</button>
          <button class="btn btn-secondary" id="restart-btn" type="button">Restart</button>
          <button class="btn btn-secondary" id="pause-sound-btn" type="button" data-sound-toggle>Sound on</button>
          <button class="btn btn-ghost" id="pause-menu-btn" type="button">Main Menu</button>
        </div>
      </div>

      <!-- ── Game over (hidden by default) ── -->
      <div id="game-over-overlay" class="overlay game-over-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
        <div class="sheet game-over-banner">
          <p class="eyebrow" id="game-over-eyebrow">Match over</p>
          <h2 class="sheet-title game-over-title" id="game-over-title">You Win</h2>
          <p class="sheet-score game-over-score" id="game-over-score" aria-label="Final score">7 : 3</p>
          <button class="btn btn-primary" id="play-again-btn" type="button">Play Again</button>
          <button class="btn btn-secondary" id="main-menu-btn" type="button">Main Menu</button>
        </div>
      </div>

      <details id="tuning-panel" style="display:none;">
        <summary>TUNE</summary>
        <div id="panel-root"></div>
      </details>

    </div>
    <!-- Everything the game needs is local: Phaser (vendor/) + the bundled game code (game.js).
         Plain scripts on purpose, so the game also starts by double-clicking index.html. -->
    <script src="vendor/phaser.min.js" onerror="window.SAMIX && window.SAMIX.fail('vendor/phaser.min.js')"></script>
    <script src="game.js" onerror="window.SAMIX && window.SAMIX.fail('game.js')"></script>
  </body>
</html>
